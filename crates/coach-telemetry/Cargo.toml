# Live AC ingestion is Windows-only. AC publishes its pages as *named*
# page-file-backed mappings (`Local\acpmf_*`), which we open with minimal Win32
# FFI (OpenFileMappingW + MapViewOfFile) — see src/live.rs. `memmap2` maps
# on-disk files and cannot open these named mappings, so it is not used here.

[lints]
