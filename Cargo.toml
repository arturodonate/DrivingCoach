[workspace]
resolver = "2"
members = [
    "crates/coach-core",
    "crates/coach-telemetry",
    "crates/coach-storage",
    "crates/coach-analysis",
    "crates/coach-cue",
    "crates/coach-summary",
    "crates/coach-rt",
    "crates/coach",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/arturodonate/DrivingCoach"
authors = ["Arturo <ArturoD@nvix.net>"]

[workspace.dependencies]
# Internal crates
coach-core = { path = "crates/coach-core" }
coach-telemetry = { path = "crates/coach-telemetry" }
coach-storage = { path = "crates/coach-storage" }
coach-analysis = { path = "crates/coach-analysis" }
coach-cue = { path = "crates/coach-cue" }
coach-summary = { path = "crates/coach-summary" }
coach-rt = { path = "crates/coach-rt" }

# Shared third-party deps (pinned once for the whole workspace)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
